<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Radiation">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4cfae"/><stop offset="1" stop-color="#e8b39c"/></linearGradient>
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="320" y1="320" x2="320" y2="20"><stop offset="0" stop-color="#ffd9bd" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd9bd" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rayblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="speckle"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="7" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.61  0 0 0 0 0.88  0 0 0 1.4 -0.55"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <rect width="640" height="640" filter="url(#speckle)" opacity="0.7"/>
  <ellipse cx="80" cy="420" rx="220" ry="200" fill="#a89be0" opacity="0.65" filter="url(#soft)"/>
  <g stroke="url(#ray)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#rayblur)">
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(0 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(15 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(30 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(45 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(60 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(75 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(90 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(105 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(120 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(135 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(150 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(165 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(180 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(195 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(210 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(225 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(240 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(255 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(270 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(285 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(300 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(315 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(330 320 320)"/>
    <line x1="320" y1="320" x2="320" y2="40" transform="rotate(345 320 320)"/>
  </g>
  <circle cx="320" cy="320" r="120" fill="#ffb98f" opacity="0.9" filter="url(#soft)"/>
  <circle cx="320" cy="320" r="46" fill="#fff0e2" opacity="0.95" filter="url(#rayblur)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
