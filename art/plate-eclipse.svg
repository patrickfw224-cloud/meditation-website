<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Eclipse">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dcc9"/><stop offset="1" stop-color="#d9def0"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <ellipse cx="520" cy="560" rx="260" ry="170" fill="#8b9ad0" opacity="0.75" filter="url(#soft)"/>
  <circle cx="380" cy="270" r="210" fill="#e0574f" opacity="0.9" filter="url(#soft)"/>
  <circle cx="360" cy="240" r="120" fill="#f08a76" opacity="0.85" filter="url(#softer)"/>
  <ellipse cx="140" cy="420" rx="160" ry="120" fill="#f3d7c4" opacity="0.9" filter="url(#soft)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
