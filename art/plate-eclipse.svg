<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="A head seen from behind, lit coral at the crown">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dcc9"/><stop offset="1" stop-color="#d9def0"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0574f"/><stop offset="0.42" stop-color="#ef8b78"/><stop offset="0.8" stop-color="#a99ed8"/><stop offset="1" stop-color="#8b9ad0"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="fine" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <ellipse cx="560" cy="560" rx="220" ry="170" fill="#6f86d6" opacity="0.6" filter="url(#soft)"/>
  <circle cx="370" cy="170" r="160" fill="#e0574f" opacity="0.8" filter="url(#soft)"/>
  <ellipse cx="390" cy="720" rx="320" ry="170" fill="#8b9ad0" opacity="0.95" filter="url(#edge)"/>
  <ellipse cx="400" cy="520" rx="74" ry="96" fill="#9aa5d4" opacity="0.95" filter="url(#edge)"/>
  <ellipse cx="390" cy="300" rx="168" ry="198" fill="url(#head)" filter="url(#edge)"/>
  <ellipse cx="528" cy="332" rx="22" ry="36" fill="#d98a8a" opacity="0.85" filter="url(#fine)"/>
  <ellipse cx="130" cy="430" rx="160" ry="120" fill="#f3d7c4" opacity="0.9" filter="url(#soft)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
