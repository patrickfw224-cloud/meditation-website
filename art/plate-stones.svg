<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Stones">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5cde9"/><stop offset="1" stop-color="#9daad8"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="stone" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <ellipse cx="560" cy="120" rx="200" ry="150" fill="#a89be0" opacity="0.7" filter="url(#soft)"/>
  <ellipse cx="120" cy="90" rx="180" ry="120" fill="#eba184" opacity="0.45" filter="url(#soft)"/>
  <g fill="#7f8fc4" opacity="0.55" filter="url(#shadow)">
    <ellipse cx="322" cy="560" rx="230" ry="46"/><ellipse cx="322" cy="470" rx="190" ry="36"/><ellipse cx="322" cy="396" rx="150" ry="28"/><ellipse cx="322" cy="336" rx="118" ry="22"/><ellipse cx="322" cy="288" rx="90" ry="17"/><ellipse cx="322" cy="250" rx="66" ry="12"/>
  </g>
  <g fill="#f4f4fb" opacity="0.92" filter="url(#stone)">
    <ellipse cx="320" cy="540" rx="225" ry="44"/><ellipse cx="320" cy="452" rx="185" ry="34"/><ellipse cx="320" cy="380" rx="146" ry="27"/><ellipse cx="320" cy="322" rx="114" ry="21"/><ellipse cx="320" cy="276" rx="86" ry="16"/><ellipse cx="320" cy="240" rx="62" ry="12"/><ellipse cx="320" cy="212" rx="42" ry="9"/>
  </g>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
