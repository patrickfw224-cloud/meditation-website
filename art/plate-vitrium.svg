<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Vitrium">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d5dbf0"/><stop offset="1" stop-color="#f1d2c2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#a89be0" stop-opacity="0.45"/><stop offset="1" stop-color="#8b9ad0" stop-opacity="0.6"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="hl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <ellipse cx="330" cy="380" rx="220" ry="160" fill="#8b9ad0" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="480" cy="520" rx="180" ry="110" fill="#eba184" opacity="0.6" filter="url(#soft)"/>
  <path fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5" filter="url(#edge)" d="M200 300c10-90 90-140 170-124 90 18 150 88 120 176-24 70-110 120-190 96C220 424 190 380 200 300z"/>
  <path fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" d="M244 258c22-34 60-58 104-64"/>
  <ellipse cx="290" cy="290" rx="70" ry="40" fill="#ffffff" opacity="0.55" filter="url(#hl)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
