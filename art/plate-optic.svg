<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Optic">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece4f3"/><stop offset="1" stop-color="#cfd6ee"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="ring" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#wash)"/>
  <ellipse cx="150" cy="140" rx="200" ry="160" fill="#eba184" opacity="0.6" filter="url(#soft)"/>
  <circle cx="340" cy="330" r="200" fill="#b3a6e3" opacity="0.7" filter="url(#soft)"/>
  <g fill="none" stroke="#a89be0" stroke-opacity="0.55" stroke-width="2" filter="url(#ring)">
    <circle cx="340" cy="330" r="240"/><circle cx="340" cy="330" r="190"/><circle cx="340" cy="330" r="140"/><circle cx="340" cy="330" r="90"/>
  </g>
  <circle cx="340" cy="330" r="60" fill="#8b9ad0" opacity="0.8" filter="url(#ring)"/>
  <ellipse cx="300" cy="290" rx="34" ry="18" fill="#ffffff" opacity="0.7" transform="rotate(-30 300 290)" filter="url(#ring)"/>
  <rect width="640" height="640" filter="url(#noise)" opacity="0.09" style="mix-blend-mode:multiply"/>
</svg>
